name: Deploy FE Prod (Blue-Green Routing)

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to OCIR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.OCI_REGISTRY }}/axslwmgnmqcx/findtheoctopus-fe:latest
          build-args: |
            VITE_BASE_URL=https://api.find-octopus.com/api
            VITE_WS_URL=wss://socket.find-octopus.com

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Blue-Green Switch via OCI Routing Policy (FE)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.OCI_REGISTRY }}/axslwmgnmqcx/findtheoctopus-fe:latest"

            LB_OCID="${{ secrets.OCI_LB_OCID }}"
            ROUTING_POLICY_NAME="Octopus-Main-Policy"

            PROD_RULE_NAME="Prod_FE_Rule"

            BLUE_SET="FE-BLUEset"
            GREEN_SET="FE-GREENset"

            BLUE_PORT=81
            GREEN_PORT=82

            CONTAINER_PORT=80

            if ! command -v jq >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y jq
            fi

            echo "🔍 Reading current routing policy..."
            CUR_JSON=$(oci lb routing-policy get --load-balancer-id "$LB_OCID" --routing-policy-name "$ROUTING_POLICY_NAME")
            CURRENT_SET=$(echo "$CUR_JSON" | jq -r --arg RN "$PROD_RULE_NAME" '.data.rules[] | select(.name==$RN) | .actions[0].backendSetName')

            if [ -z "$CURRENT_SET" ] || [ "$CURRENT_SET" = "null" ]; then
              echo "❌ Cannot find rule name '$PROD_RULE_NAME' in routing policy '$ROUTING_POLICY_NAME'."
              exit 1
            fi

            echo "✅ Current FE PROD backend set: $CURRENT_SET"

            if [ "$CURRENT_SET" = "$BLUE_SET" ]; then
              TARGET_SET="$GREEN_SET"
              TARGET_COLOR="green"
              TARGET_PORT=$GREEN_PORT
              OLD_COLOR="blue"
            else
              TARGET_SET="$BLUE_SET"
              TARGET_COLOR="blue"
              TARGET_PORT=$BLUE_PORT
              OLD_COLOR="green"
            fi

            echo "🚀 Switching FE to $TARGET_COLOR: set=$TARGET_SET, port=$TARGET_PORT"

            echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login "${{ secrets.OCI_REGISTRY }}" -u "${{ secrets.OCI_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            docker rm -f "octopus-fe-$TARGET_COLOR" >/dev/null 2>&1 || true

            docker run -d --name "octopus-fe-$TARGET_COLOR" \
              -p "$TARGET_PORT:$CONTAINER_PORT" \
              --restart unless-stopped \
              "$IMAGE"

            echo "⏳ Waiting for FE health check..."
            OK=0
            for i in {1..20}; do
              if curl -sf "http://127.0.0.1:$TARGET_PORT/" >/dev/null 2>&1; then
                OK=1; break
              fi
              sleep 3
            done

            if [ "$OK" -ne 1 ]; then
              echo "❌ FE Health check failed on http://127.0.0.1:$TARGET_PORT/"
              docker logs --tail 200 "octopus-fe-$TARGET_COLOR" || true
              exit 1
            fi
            echo "✅ FE is healthy on port $TARGET_PORT"

            echo "🔁 Updating routing policy rule action backendSetName -> $TARGET_SET"

            UPDATED_RULES=$(echo "$CUR_JSON" | jq --arg RN "$PROD_RULE_NAME" --arg BS "$TARGET_SET" '
              .data.rules
              | map(
                  if .name === $RN
                  then (.actions[0].backendSetName = $BS)
                  else .
                  end
                )
            ')

            echo "$UPDATED_RULES" > /tmp/fe-rules.json

            oci lb routing-policy update \
              --load-balancer-id "$LB_OCID" \
              --routing-policy-name "$ROUTING_POLICY_NAME" \
              --rules file:///tmp/fe-rules.json

            echo "✅ Routing policy switched to $TARGET_SET"

            echo "🧹 Cleanup old FE container after stabilization..."
            sleep 60
            docker rm -f "octopus-fe-$OLD_COLOR" >/dev/null 2>&1 || true

            echo "🎉 Active FE: $TARGET_COLOR ($TARGET_PORT) / backendSet: $TARGET_SET"
